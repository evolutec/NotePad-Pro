<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="d" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd89b" />
      <stop offset="100%" stop-color="#19547b" />
    </radialGradient>
    <filter id="blur10">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#d)" />

  <!-- subtle soft card like shape for depth -->
  <g opacity="0.08" filter="url(#blur10)">
    <rect x="120" y="80" width="900" height="420" rx="40" fill="#ffffff" />
  </g>

  <!-- very light translucent highlight -->
  <rect width="100%" height="100%" fill="white" opacity="0.01" />
</svg>
