<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="45%" stop-color="#fad0c4" />
      <stop offset="100%" stop-color="#fad0c4" stop-opacity="0.3" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- layered circles -->
  <g fill-opacity="0.12">
    <circle cx="220" cy="200" r="260" fill="#7b2ff7" />
    <circle cx="900" cy="180" r="220" fill="#00d2ff" />
    <circle cx="640" cy="540" r="320" fill="#7b2ff7" />
    <circle cx="300" cy="520" r="180" fill="#ff6b6b" />
  </g>

  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)" />
</svg>
