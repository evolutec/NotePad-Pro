<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g11" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#181a1c" />
    </linearGradient>
    <filter id="softGlow11" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g11)" />

  <!-- bandes diagonales croisées (mêmes tons que bg12 mais forme différente) -->
  <g filter="url(#softGlow11)" opacity="0.97">
    <path d="M-100 80 C200 220 400 40 1200 120" fill="none" stroke="#222" stroke-width="72" opacity="0.18" stroke-linecap="round" />
    <path d="M-100 260 C250 420 500 180 1200 260" fill="none" stroke="#222" stroke-width="48" opacity="0.13" stroke-linecap="round" />
    <path d="M-100 440 C300 680 700 340 1200 440" fill="none" stroke="#222" stroke-width="36" opacity="0.11" stroke-linecap="round" />
    <path d="M-100 620 C350 880 900 500 1200 620" fill="none" stroke="#222" stroke-width="24" opacity="0.09" stroke-linecap="round" />

    <!-- ondes inverses pour créer croisement subtil -->
    <path d="M0 720 C400 460 800 920 1200 720" fill="none" stroke="#222" stroke-width="36" opacity="0.10" stroke-linecap="round" />
    <path d="M0 520 C450 260 850 760 1200 520" fill="none" stroke="#222" stroke-width="20" opacity="0.08" stroke-linecap="round" />
  </g>
</svg>
