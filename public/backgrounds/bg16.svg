<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="n16" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071029" />
      <stop offset="50%" stop-color="#072b52" />
      <stop offset="100%" stop-color="#0b1b3a" />
    </linearGradient>
    <filter id="glow16" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#n16)" />

  <!-- flowing neon ribbons -->
  <g filter="url(#glow16)" opacity="0.95">
    <path d="M-300 240 C100 120 300 260 700 220 C1000 190 1300 260 1600 220" stroke="#02f0ff" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-300 320 C100 220 300 380 700 320 C1000 270 1300 360 1600 320" stroke="#8a2bff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-300 400 C100 300 300 460 700 400 C1000 340 1300 440 1600 400" stroke="#00b0ff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- subtle particle dots along path -->
  <g fill="#7be6ff" fill-opacity="0.06">
    <circle cx="420" cy="230" r="3" />
    <circle cx="540" cy="250" r="2.5" />
    <circle cx="760" cy="210" r="3" />
    <circle cx="980" cy="190" r="2" />
  </g>
</svg>
