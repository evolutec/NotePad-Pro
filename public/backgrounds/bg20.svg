<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="n20" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a1a2f" />
      <stop offset="100%" stop-color="#061024" />
    </radialGradient>
    <filter id="glow20">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#n20)" />

  <!-- neon lightning/zigzag pattern -->
  <g filter="url(#glow20)" opacity="0.97">
    <polyline points="100,200 300,300 400,100 600,400 800,200 1000,500 1100,300" stroke="#00eaff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="200,600 400,500 600,700 800,400 1000,700" stroke="#a04bff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="300,400 500,600 700,300 900,600" stroke="#2fd0ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- neon dots for energy effect -->
  <g fill="#7be6ff" fill-opacity="0.09">
    <circle cx="400" cy="100" r="2.8" />
    <circle cx="600" cy="400" r="2.2" />
    <circle cx="800" cy="200" r="2.6" />
    <circle cx="1000" cy="500" r="2.2" />
    <circle cx="600" cy="700" r="2.2" />
  </g>
</svg>
