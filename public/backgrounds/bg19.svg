<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="n19" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#1a0a2b" />
    </linearGradient>
    <filter id="glow19">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#n19)" />

  <!-- neon mesh/grid (diagonal diamond pattern) -->
  <g filter="url(#glow19)" opacity="0.97">
    <g stroke="#00eaff" stroke-width="6" fill="none" opacity="0.7">
      <path d="M100 0 L1100 800" />
      <path d="M0 200 L1200 800" />
      <path d="M0 400 L1200 1000" />
      <path d="M0 600 L1200 1400" />
      <path d="M300 0 L1200 600" />
      <path d="M500 0 L1200 400" />
    </g>
    <g stroke="#a04bff" stroke-width="6" fill="none" opacity="0.7">
      <path d="M1100 0 L100 800" />
      <path d="M1200 200 L0 800" />
      <path d="M1200 400 L0 1000" />
      <path d="M1200 600 L0 1400" />
      <path d="M900 0 L0 600" />
      <path d="M700 0 L0 400" />
    </g>
  </g>

  <!-- subtle neon dots at intersections -->
  <g fill="#7be6ff" fill-opacity="0.09">
    <circle cx="600" cy="400" r="3.2" />
    <circle cx="400" cy="600" r="2.2" />
    <circle cx="800" cy="200" r="2.6" />
    <circle cx="1000" cy="600" r="2.2" />
    <circle cx="200" cy="200" r="2.2" />
  </g>
</svg>
