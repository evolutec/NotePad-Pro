<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00fff9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00fff9;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
    
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <rect width="1000" height="600" fill="#0a1628"/>
  
  <!-- Vague principale cyan -->
  <path d="M 0,300 Q 250,200 500,250 T 1000,300 L 1000,600 L 0,600 Z" 
        fill="url(#glowCyan)" opacity="0.2">
    <animate attributeName="d" 
             dur="8s" 
             repeatCount="indefinite"
             values="M 0,300 Q 250,200 500,250 T 1000,300 L 1000,600 L 0,600 Z;
                     M 0,320 Q 250,220 500,270 T 1000,320 L 1000,600 L 0,600 Z;
                     M 0,300 Q 250,200 500,250 T 1000,300 L 1000,600 L 0,600 Z"/>
  </path>
  
  <!-- Vague secondaire orange -->
  <path d="M 0,350 Q 250,280 500,320 T 1000,350 L 1000,600 L 0,600 Z" 
        fill="url(#glowOrange)" opacity="0.15">
    <animate attributeName="d" 
             dur="6s" 
             repeatCount="indefinite"
             values="M 0,350 Q 250,280 500,320 T 1000,350 L 1000,600 L 0,600 Z;
                     M 0,370 Q 250,300 500,340 T 1000,370 L 1000,600 L 0,600 Z;
                     M 0,350 Q 250,280 500,320 T 1000,350 L 1000,600 L 0,600 Z"/>
  </path>
  
  <!-- Particules cyan -->
  <g id="particlesCyan">
    <circle cx="100" cy="250" r="2" fill="#00fff9" opacity="0.8">
      <animate attributeName="cy" values="250;230;250" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="200" r="1.5" fill="#00fff9" opacity="0.6">
      <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="230" r="2.5" fill="#00fff9" opacity="0.7">
      <animate attributeName="cy" values="230;210;230" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="1.8" fill="#00fff9" opacity="0.8">
      <animate attributeName="cy" values="180;160;180" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="220" r="2.2" fill="#00fff9" opacity="0.7">
      <animate attributeName="cy" values="220;200;220" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="190" r="1.6" fill="#00fff9" opacity="0.6">
      <animate attributeName="cy" values="190;170;190" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="240" r="2" fill="#00fff9" opacity="0.8">
      <animate attributeName="cy" values="240;220;240" dur="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="210" r="2.3" fill="#00fff9" opacity="0.7">
      <animate attributeName="cy" values="210;190;210" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="260" r="1.7" fill="#00fff9" opacity="0.6">
      <animate attributeName="cy" values="260;240;260" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="230" r="2.1" fill="#00fff9" opacity="0.8">
      <animate attributeName="cy" values="230;210;230" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="200" r="1.9" fill="#00fff9" opacity="0.7">
      <animate attributeName="cy" values="200;180;200" dur="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="250" r="2.4" fill="#00fff9" opacity="0.8">
      <animate attributeName="cy" values="250;230;250" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Particules orange -->
  <g id="particlesOrange">
    <circle cx="130" cy="320" r="1.8" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="320;300;320" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="350" r="2.2" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="350;330;350" dur="3.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="300" r="1.5" fill="#ff6b35" opacity="0.6">
      <animate attributeName="cy" values="300;280;300" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="340" r="2" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="340;320;340" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="310" r="2.3" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="310;290;310" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="360" r="1.7" fill="#ff6b35" opacity="0.6">
      <animate attributeName="cy" values="360;340;360" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="330" r="2.1" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="330;310;330" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="290" r="1.9" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="290;270;290" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="350" r="2.2" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="350;330;350" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="320" r="1.6" fill="#ff6b35" opacity="0.6">
      <animate attributeName="cy" values="320;300;320" dur="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="340" r="2" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="340;320;340" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Lignes de connexion animées -->
  <g opacity="0.3" filter="url(#blur)">
    <line x1="100" y1="250" x2="300" y2="180" stroke="#00fff9" stroke-width="0.5">
      <animate attributeName="y1" values="250;230;250" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="180;160;180" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="180" x2="520" y2="240" stroke="#00fff9" stroke-width="0.5">
      <animate attributeName="y1" values="180;160;180" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="240;220;240" dur="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="340" x2="580" y2="330" stroke="#ff6b35" stroke-width="0.5">
      <animate attributeName="y1" values="340;320;340" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="330;310;330" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Points lumineux supplémentaires -->
  <g>
    <circle cx="400" cy="280" r="3" fill="#00fff9" opacity="0.9">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="310" r="3.5" fill="#ff6b35" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>