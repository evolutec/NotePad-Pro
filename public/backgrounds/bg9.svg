<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="blobG" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="100%" stop-color="#fecfef" />
    </linearGradient>
    <filter id="blurf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />

  <g filter="url(#blurf)" opacity="0.9">
    <ellipse cx="300" cy="250" rx="260" ry="160" fill="#7b2ff7" />
    <ellipse cx="800" cy="260" rx="200" ry="140" fill="#00d2ff" />
    <ellipse cx="520" cy="520" rx="300" ry="180" fill="#ff6b6b" />
  </g>

  <rect width="100%" height="100%" fill="transparent" />
</svg>
